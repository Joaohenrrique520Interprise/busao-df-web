<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Busão DF</title>
  <meta name="description" content="Ônibus do DF em tempo real: quanto falta para passar na sua parada.">
  <meta name="theme-color" content="#0f1d2e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icones/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/maplibre-gl.css?v=6">
  <link rel="stylesheet" href="/estilo.css?v=7">
  <script>
    // Tema antes de pintar: escolha salva, senão escuro das 18h às 6h.
    try {
      const t = JSON.parse(localStorage.getItem("busao:tema"));
      const h = new Date().getHours();
      document.documentElement.dataset.tema = t === "claro" || t === "escuro" ? t : (h >= 18 || h < 6 ? "escuro" : "claro");
    } catch { document.documentElement.dataset.tema = "claro"; }
  </script>
</head>
<body>
  <div id="mapa" role="region" aria-label="Mapa com os ônibus"></div>

  <!-- celular: busca flutuante -->
  <div class="topo">
    <div class="busca" data-busca>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Linha (0.809) ou destino" aria-label="Buscar linha ou destino" autocomplete="off" enterkeyhint="search">
      <button class="limpar oculto" type="button" aria-label="Limpar busca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="sugestoes oculto" role="listbox"></div>
    </div>
    <button class="botao-redondo" type="button" data-acao="tema" aria-label="Trocar tema claro/escuro"></button>
  </div>

  <div class="status" data-estado="conectando" role="status" aria-live="polite"><i></i><span>Conectando…</span></div>

  <aside class="folha" aria-label="Informações">
    <div class="alca" aria-hidden="true"><span></span></div>
    <!-- desktop: marca + busca dentro do painel -->
    <div class="cabecalho-desktop">
      <div class="linha-topo">
        <div class="marca"><span class="marca-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></svg></span>Busão DF</div>
        <button class="icone-botao" type="button" data-acao="tema" aria-label="Trocar tema claro/escuro"></button>
      </div>
      <div class="busca" data-busca>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Linha (0.809) ou destino" aria-label="Buscar linha ou destino" autocomplete="off" enterkeyhint="search">
        <button class="limpar oculto" type="button" aria-label="Limpar busca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="sugestoes oculto" role="listbox"></div>
      </div>
    </div>
    <div class="folha-corpo" id="conteudo" aria-live="polite"></div>
  </aside>

  <div class="toast" role="alert"></div>

  <script src="/vendor/maplibre-gl.js?v=6"></script>
  <script type="module" src="/js/app.js?v=7"></script>
</body>
</html>
